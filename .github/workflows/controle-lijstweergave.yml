name: Controle gedeelde publieke weergaven
on:
  push:
    paths:
      - 'index.html'
      - 'beheer/index.html'
      - 'website-bestanden/idea-view-shared.js'
      - 'website-bestanden/discovery-view-shared.js'
      - 'website-bestanden/admin-discovery.js'
      - 'website-bestanden/admin-polish.js'
      - 'website-bestanden/*site-settings*.js'
      - 'website-bestanden/*agenda*.js'
      - 'website-bestanden/select-view-shared.js'
      - 'website-bestanden/*css'
      - 'website-bestanden/scripts/build-admin-public-view.js'
      - 'website-bestanden/tests/**'
      - '.github/workflows/controle-lijstweergave.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'beheer/index.html'
      - 'website-bestanden/idea-view-shared.js'
      - 'website-bestanden/discovery-view-shared.js'
      - 'website-bestanden/admin-discovery.js'
      - 'website-bestanden/admin-polish.js'
      - 'website-bestanden/*site-settings*.js'
      - 'website-bestanden/*agenda*.js'
      - 'website-bestanden/select-view-shared.js'
      - 'website-bestanden/*css'
      - 'website-bestanden/scripts/build-admin-public-view.js'
      - 'website-bestanden/tests/**'
      - '.github/workflows/controle-lijstweergave.yml'
permissions:
  contents: read
jobs:
  lijstweergave:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test website-bestanden/tests/idea-list-parity.test.cjs website-bestanden/tests/agenda-check-status.test.cjs website-bestanden/tests/review-fixes.test.cjs website-bestanden/tests/featured-carousel.test.cjs website-bestanden/tests/site-settings.test.cjs
      - run: node website-bestanden/scripts/build-admin-public-view.js --check
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Vergelijk zoekbalk en filters op desktop en mobiel
        run: |
          python3 -m http.server 8765 >/tmp/discovery-server.log 2>&1 &
          node website-bestanden/tests/discovery-parity.browser.cjs
          node website-bestanden/tests/agenda-parity.browser.cjs
          node website-bestanden/tests/admin-workflows.browser.cjs
